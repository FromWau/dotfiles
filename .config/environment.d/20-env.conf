# The session's environment, the one source for every login: systemd reads this folder for the services and D-Bus
# apps it starts, ~/.profile imports it for the greetd session, and fish's config for TTY and ssh logins.
EDITOR=nvim
BROWSER=firefox
TERMINAL=ghostty

XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache

ANSIBLE_HOME=${XDG_DATA_HOME}/ansible
PASSWORD_STORE_DIR=${XDG_DATA_HOME}/password-store
GOPATH=${XDG_DATA_HOME}/go
GNUPGHOME=${XDG_DATA_HOME}/gnupg
CARGO_HOME=${XDG_DATA_HOME}/cargo
RUSTUP_HOME=${XDG_DATA_HOME}/rustup
KONAN_DATA_DIR=${XDG_DATA_HOME}/konan
WINEPREFIX=${XDG_DATA_HOME}/wineprefixes/default
TERMINFO=${XDG_DATA_HOME}/terminfo
TERMINFO_DIRS=${XDG_DATA_HOME}/terminfo:/usr/share/terminfo

DOCKER_CONFIG=${XDG_CONFIG_HOME}/docker
NPM_CONFIG_USERCONFIG=${XDG_CONFIG_HOME}/npm/npmrc
XINITRC=${XDG_CONFIG_HOME}/X11/xinitrc
WGETRC=${XDG_CONFIG_HOME}/wget/wgetrc
ZDOTDIR=${XDG_CONFIG_HOME}/zsh
GTK2_RC_FILES=${XDG_CONFIG_HOME}/gtk-2.0/gtkrc
_JAVA_OPTIONS=-Djava.util.prefs.userRoot=${XDG_CONFIG_HOME}/java

HISTFILE=${XDG_STATE_HOME}/bash/history
PYTHON_HISTORY=${XDG_STATE_HOME}/python_history

XAUTHORITY=${XDG_RUNTIME_DIR}/Xauthority
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
QT_QPA_PLATFORM=wayland;xcb

MPD_HOST=${XDG_RUNTIME_DIR}/mpd/socket

ANDROID_USER_HOME=${XDG_DATA_HOME}/android
ANDROID_HOME=${XDG_DATA_HOME}/android/sdk
GRADLE_USER_HOME=${XDG_DATA_HOME}/gradle

CUDA_CACHE_PATH=${XDG_CACHE_HOME}/nv
SQLITE_HISTORY=${XDG_CACHE_HOME}/sqlite_history

MANPAGER="sh -c 'bat -l man -p'"
LESSHISTFILE=-
FZF_DEFAULT_COMMAND="fd --type f --strip-cwd-prefix --hidden --follow --exclude .git"
DELTA_FEATURES="+side-by-side +dark +syntax-theme base16-256 +true-color +navigate"

# Toolkits: Wayland first. Set here rather than in Hyprland's config so apps D-Bus or systemd starts get them too.
GDK_BACKEND=wayland,x11,*
SDL_VIDEODRIVER=wayland,x11,kmsdrm
CLUTTER_BACKEND=wayland
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_QPA_PLATFORMTHEME=qt5ct
ELECTRON_OZONE_PLATFORM_HINT=auto
ADW_DISABLE_PORTAL=1

# Cursor size; the theme is set at runtime by `hyprctl setcursor` in Hyprland's monitors.lua.
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
